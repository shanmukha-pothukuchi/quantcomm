[project]
name = "floodalpha"
version = "0.1.0"
description = "Sentinel-1 flood mapping -> US bank exposure -> Nessie stress test -> market test"
requires-python = ">=3.11"
dependencies = [
  "earthengine-api>=1.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "rasterio>=1.4",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy",
  "requests>=2.32",
  "yfinance>=0.2.40",
  "statsmodels>=0.14",
  "streamlit>=1.38",
  "folium>=0.17",
  "streamlit-folium>=0.22",
  "pydeck",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "scipy",
  "scikit-learn",
  "pillow",
  "matplotlib",
  "pyogrio",
  "tqdm",
  "pystac-client",
  "planetary-computer",
  "rioxarray",
  "xarray",
  "altair",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floodalpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
